# ------------------------------------------------------------
# DAIS Intraday Production Configuration
# ------------------------------------------------------------

# Target Intraday Execution Universe
tickers:
  - MSFT
  - META
  - STT
  - SOXX
  - GOOG
benchmark: ^IXIC

# High-Frequency Timeframe Configuration
# period_years is replaced with an explicit day-range lookback for intraday bars
# Intraday bars are preferred for high-frequency signal and beta alignment.
# Daily bars are only used as a fallback when intraday retrieval is unavailable.
lookback_days: 30
bar_interval: "5m"        # Choices: 1m, 5m, 15m intervals

# Capital & Position Sizing Framework (Dollar-Based, Per-Ticker)
initial_capital: 1000.0           # Available capital per ticker
initial_investment_amt: 100.0     # Initial position size per ticker
fixed_buy_amt: 10.0               # Cash amount per buy trade
fixed_sell_amt: 20.0              # Cash amount per sell trade
max_consecutive_buys: 4           # Guard rail on stacked buys
max_total_sells: 3                # Guard rail on total sell events
min_remaining_inventory_pct: 0.40 # Keep at least 40% of initial investment value in inventory
beta_buy_multiplier: -0.5         # Buy when price change <= beta * multiplier
beta_sell_multiplier: 2.0         # Sell when price change >= beta * multiplier

# Execution Friction Controls (Crucial for High-Frequency Scalping)
slippage_bps: 0.0002        # 0.02% expected execution drag per entry/exit
commission_per_share: 0.000 # Flat broker fees per unit (set if using a fee-charging broker)

# Micro-Momentum Parameters
beta_default: 1.0
short_window: 9             # Fast intraday exponential trend line
long_window: 21             # Slower intraday anchor trend line

# Session Boundary Protection Rules
force_flat_at_close: true   # Prevent holding leveraged intra-day inventory overnight
market_close_buffer_min: 15 # Minutes before the closing bell to liquidate open shares

# Operational Logging Paths
output_dir: outputs/DAIS_Deliverables
data_dir: data
log_level: INFO
max_workers: 4
